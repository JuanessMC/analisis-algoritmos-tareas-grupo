<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafos: rutas entre aeropuertos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Grafos: la mejor ruta entre aeropuertos</h1>
</header>
<main>
<section class="card map">
<svg id="map" viewBox="0 0 700 690" role="img" aria-label="Mapa de América con un grafo de aeropuertos"></svg>
<p class="hint">Una aerolínea de carga debe enviar medicamentos de Ciudad de México a Buenos Aires. La carga debe pasar por el hub de Bogotá para inspección.</p>
</section>
<aside class="side">
<div class="card">
<label for="o">Origen</label><select id="o"></select>
<label for="w">Escala obligatoria (opcional)</label><select id="w"></select>
<label for="d">Destino</label><select id="d"></select>
<div class="row"><button class="go" id="fly">Volar ✈</button><button id="rs">Reiniciar mapa</button></div>
<label for="v">Velocidad del avión</label><input type="range" id="v" min="0.4" max="3" step="0.1" value="1">
</div>
<div class="card res" id="res" aria-live="polite"></div>
<div class="card"><h2>Dijkstra paso a paso</h2><div id="live"></div><ol id="steps" class="steps"></ol></div>
<div class="card">
</div>
</aside>
</main>
<script src="script.js"></script>
</body>
</html>
