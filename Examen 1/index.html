<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala 4B — Reservas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Programación de intervalos</div>
    <h1>Sala 4B</h1>
  </header>
  <div class="layout">

    <div class="panel" id="board-panel">
      <div class="controls">
        <button class="btn-primary" id="btn-step">Avanzar un paso</button>
        <button id="btn-play">▶ Reproducir</button>
        <button class="btn-ghost" id="btn-reset">Reiniciar</button>
        <button class="btn-ghost" id="btn-new">Generar nuevo caso</button>
        <div class="speed-group">
          <span>Velocidad</span>
          <select id="speed">
            <option value="1500">Lenta</option>
            <option value="900" selected>Media</option>
            <option value="500">Rápida</option>
          </select>
        </div>
      </div>
    </div>

  </div>

  <footer>SALA 4B · SELECCIÓN DE ACTIVIDADES</footer>
    
</div>

<script src="script.js"></script>
</body>
</html>
